name: Exportar ferramentas públicas para assinatura local Android
on:
  push:
    branches: [fix/portable-backup-unificado-20261102]
    paths:
      - ".github/workflows/export-local-signing-tools.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Copiar utilitários públicos e cópia da chave cifrada (NÃO chave privada)
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$SDK/zipalign" && test -x "$SDK/aapt2"
          mkdir -p toolkit
          cp "$SDK/zipalign" "$SDK/aapt2" toolkit/
          cp 'SaúdePrática/release-unsigned-patches/v1.9.98/MediAgenda-CHAVE-PRIVADA-ENCRIPTADA.aesgcm.b64' toolkit/keybackup.aesgcm.b64
          cp MediAgenda/tools/sign_release.py toolkit/
          test "$(wc -c < toolkit/keybackup.aesgcm.b64)" -gt 1000
          echo 'Toolkit contém apenas ferramentas públicas e backup AES-GCM cifrado.'
          sha256sum toolkit/zipalign toolkit/aapt2 toolkit/keybackup.aesgcm.b64 > toolkit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.127-PUBLIC-TOOLKIT
          path: toolkit/
          retention-days: 3
          if-no-files-found: error
