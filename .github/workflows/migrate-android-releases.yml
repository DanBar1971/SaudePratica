name: "SaúdePrática - Migrar 43 releases Android"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-android-releases.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        start: [76, 81, 86, 91, 96, 101, 106, 111, 116]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify original signed releases
        run: python3 .github/scripts/archive_legacy_releases.py ${{ matrix.start }}
  finalize:
    needs: archive
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify all 43 versions and set latest
        run: |
          set -euo pipefail
          COUNT=$(gh api 'repos/DanBar1971/SaudePratica/releases?per_page=100' --jq '[.[] | select(.draft == false and (.tag_name | startswith("v1.9.")))] | length')
          test "$COUNT" -ge 43
          gh release edit v1.9.118 --repo DanBar1971/SaudePratica --latest
          test "$(gh api repos/DanBar1971/SaudePratica/releases/latest --jq .tag_name)" = v1.9.118
          echo "Archived and verified 43 releases (v1.9.76–v1.9.118)"
