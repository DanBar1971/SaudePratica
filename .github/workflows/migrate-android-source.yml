name: SaúdePrática — Importar código Android original
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-android-source.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saudepratica-legacy-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Obter código público da versão Android original
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/DanBar1971/AndroidAppDev.git "$RUNNER_TEMP/androidappdev"
          cd "$RUNNER_TEMP/androidappdev"
          git fetch --depth 1 origin db31c615a8c7d4b5f12331b0e7df1881c373c1cb
          git checkout --detach db31c615a8c7d4b5f12331b0e7df1881c373c1cb
          test -s MediAgenda/source/part_00.b64
          test -s MediAgenda/v138_overrides/apply_v138.py
          test -s .github/workflows/mediagenda-v1969.yml
      - name: Importar fontes, patches e pipeline de compilação
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/androidappdev"
          mkdir -p MediAgenda 'SaúdePrática' .github/workflows android windows ios shared docs
          rsync -a "$SOURCE/MediAgenda/" MediAgenda/
          rsync -a "$SOURCE/SaúdePrática/" 'SaúdePrática/'
          cp "$SOURCE/.github/workflows/mediagenda-build.yml" '.github/workflows/mediagenda-build.yml'
          cp "$SOURCE/.github/workflows/mediagenda-v1969.yml" '.github/workflows/saudepratica-android.yml'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/saudepratica-android.yml')
          s=p.read_text(encoding='utf8')
          assert 'branches: [master]' in s
          s=s.replace('branches: [master]','branches: [main]')
          s=s.replace('refs/heads/master','refs/heads/main')
          s=s.replace('mediagenda-v1969.yml','saudepratica-android.yml')
          marker='      - name: Install audited AES-GCM recovery dependency (trusted master only)'
          assert marker in s
          readiness='''      - name: Verificar disponibilidade do certificado original
            env:
              ORIGINAL_KEY_RECOVERY: ${{ secrets.SAUDEPRACTICA_SIGNING_RECOVERY_HEX }}
            run: |
              if [ -n "$ORIGINAL_KEY_RECOVERY" ]; then
                echo 'CAN_SIGN_ORIGINAL=true' >> "$GITHUB_ENV"
              else
                echo 'CAN_SIGN_ORIGINAL=false' >> "$GITHUB_ENV"
                echo '::notice::A compilação continua; assinatura original ainda não configurada neste repositório.'
              fi
          '''
          s=s.replace(marker,readiness+marker,1)
          cond="github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
          assert s.count("if: "+cond)==3,s.count("if: "+cond)
          s=s.replace("if: "+cond,"if: "+cond+" && env.CAN_SIGN_ORIGINAL == 'true'")
          p.write_text(s,encoding='utf8')
          pub=Path('MediAgenda/tools/publish_release.sh')
          x=pub.read_text(encoding='utf8')
          assert "DanBar1971/AndroidAppDev" in x
          x=x.replace("DanBar1971/AndroidAppDev","DanBar1971/SaudePratica")
          x=x.replace('gh workflow run saudepratica-pages.yml --repo "$REPO" --ref master',
                      'gh workflow run pages.yml --repo "$REPO" --ref main')
          pub.write_text(x,encoding='utf8')
          assert not any(Path('.').rglob('*.jks'))
          assert not any(Path('.').rglob('*.keystore'))
          PY
      - name: Documentar proveniência e próximas plataformas
        shell: bash
        run: |
          cat > docs/MIGRACAO_GITHUB.md <<'EOF'
          # SaúdePrática: transferência de código
          Origem: https://github.com/DanBar1971/AndroidAppDev
          Snapshot: db31c615a8c7d4b5f12331b0e7df1881c373c1cb (v1.9.118).
          Destino: https://github.com/DanBar1971/SaudePratica
          O conteúdo atual dos scripts e patches Android foi copiado;
          o histórico dos commits antigos permanece na origem para auditoria.
          As 43 releases antigas são transferidas em separado, com as mesmas APKs.
          Não foram copiados segredos de GitHub nem chaves privadas.
          Configurar no novo repositório SAUDEPRACTICA_SIGNING_RECOVERY_HEX
          para assinar versões futuras com o mesmo certificado.
          Atualizar os URLs de auto-update da aplicação antes de retirar a origem.
          Nunca colocar dados clínicos pessoais no repositório público.
          EOF
          cat > android/README.md <<'EOF'
          # Android
          A fonte histórica recompilável encontra-se em ../MediAgenda.
          A pipeline de build é .github/workflows/saudepratica-android.yml.
          Preservar com.mediagenda.app.stable e certificado de assinatura original.
          Não publicar nova APK se a assinatura original não estiver configurada.
          EOF
          cat > windows/README.md <<'EOF'
          # SaúdePrática Windows
          Cliente desktop planeado; ainda não há EXE ou MSI funcional.
          Pretende-se gerir perfis, medicação, agenda e documentos no Windows,
          com sincronização segura, mantendo o Android como alarme principal.
          A paridade funcional deve ser verificada a cada versão publicada.
          EOF
          cat > ios/README.md <<'EOF'
          # SaúdePrática iPhone
          Plataforma planeada. Ainda não existe aplicação iOS compilável;
          publicar requer projeto iOS, macOS e conta/certificados Apple.
          EOF
          cat > shared/README.md <<'EOF'
          # Contratos comuns
          Os formatos de exportação JSON, regras clínicas, sincronização e
          validação devem ser partilhados/testados entre Android, Windows e iOS.
          Um repositório único não garante compilação automática multiplataforma.
          EOF
      - name: Guardar código no repositório oficial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MediAgenda 'SaúdePrática' android windows ios shared docs/MIGRACAO_GITHUB.md
          if git diff --cached --quiet; then
            echo "Código já importado"
            exit 0
          fi
          git commit -m "Importar SaúdePrática Android v1.9.118 e preparar plataformas"
          git push origin HEAD:main
          echo "::notice::Fontes Android importadas no repositório oficial."
