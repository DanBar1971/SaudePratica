name: Publicar website SaúdePrática
on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - script.js
      - assets/**
      - info_saude/**
      - windows/**
      - ios/**
      - shared/**
      - .nojekyll
      - robots.txt
      - sitemap.xml
      - .github/workflows/pages.yml
  workflow_dispatch:
  release:
    types: [published, edited]
  workflow_run:
    workflows:
      - "SaúdePrática Desktop — Windows experimental build"
      - "SaudePratica Android Build + AutoRelease"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saudepratica-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o website
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar ficheiros e identidade visual
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html && test -s styles.css && test -s script.js
          for image in saude_icon saude_splash saude_background; do
            file "assets/$image.png" | grep -F 'PNG image data'
            test "$(stat -c%s "assets/$image.png")" -gt 1000
          done
          grep -F 'github.com/DanBar1971/SaudePratica/releases/latest/download/SaudePratica.apk' index.html
          grep -F 'https://danbar1971.github.io/SaudePratica/' index.html
          grep -F 'id="plataformas"' index.html
          grep -F 'Windows 10 / 11' index.html
          grep -F 'iPhone / iOS' index.html
          grep -F 'data-windows-download' index.html
          grep -F 'releases/download/windows-v0.6.0-preview/SaudePratica-Setup.exe' index.html
          grep -F 'releases/download/windows-v0.6.0-preview/SaudePratica-Setup.exe' windows/README.md
          grep -F 'releases/download/windows-v0.6.0-preview/SaudePratica-Setup.exe' README.md
          if grep -Fq 'data-windows-download href="https://github.com/DanBar1971/SaudePratica/releases"' index.html; then
            echo 'ERRO: botão Windows não pode apontar para lista genérica de Releases'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          assert html.count('data-windows-download href="https://github.com/DanBar1971/SaudePratica/releases/download/windows-v0.6.0-preview/SaudePratica-Setup.exe"') >= 3
          assert 'id="plataformas"' in html
          print("Windows: 3 botões com ligação direta ao instalador verificados.")
          PY
          grep -F 'SaudePratica-Setup.exe' script.js
          grep -F 'releases?per_page=60' script.js
          if grep -iEn 'private.?key|keystore|\.jks|password|token=' index.html script.js styles.css; then
            echo "::error::Possível segredo exposto no website"
            exit 1
          fi
          mkdir -p public/assets
          cp index.html styles.css script.js .nojekyll robots.txt sitemap.xml public/
          cp assets/saude_icon.png assets/saude_splash.png assets/saude_background.png public/assets/
          test -s info_saude/informacoes.json
          jq -e '.schema_version==1 and (.items|length>0)' info_saude/informacoes.json
          test -s info_saude/imagens/info_001.png
          cp -a info_saude public/info_saude
          test -s public/info_saude/informacoes.json
          test -s public/info_saude/imagens/info_001.png
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ficheiros do website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar website
        id: deployment
        uses: actions/deploy-pages@v4
