name: Publicar SaúdePrática Android 1.9.130 NORMAL com IA leve opcional
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-19130-stable.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout original
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Confirmar CI, testes e assinatura ORIGINAL aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$REPO" = "DanBar1971/SaudePratica"
          test "$(gh api "repos/$REPO/actions/runs/41650930554" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/41650930554" --jq .head_sha)" = ef72e227bcb1494c8bac77f2335fe082e6777e50
          test "$(gh api "repos/$REPO/actions/runs/41650930554" --jq .head_branch)" = feat/android-19130-qwen-small-offline
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41653371402 --jq .conclusion)" = success
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41653371402 --jq .head_sha)" = 3720315fe0e4d1e9d43b94c45677a605a1e8974e
          CURRENT="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          test "$CURRENT" = v1.9.129 || test "$CURRENT" = v1.9.130
      - name: Descarregar artefacto assinado — sem ler a chave privada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41653371402 --repo DanBar1971/AndroidAppDev \
            --name SaudePratica-v1.9.130-ORIGINAL-SIGNED --dir signed
          test -s signed/SaudePratica.apk
          test -s signed/SHA256SUMS.txt
          test "$(tr -d '[:space:]' < signed/source-run.txt)" = 41650930554
          (cd signed && sha256sum -c SHA256SUMS.txt)
          cp signed/SaudePratica.apk ./
      - name: Validar identidade, assinatura Android v2/v3 e biblioteca IA incluída
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee signature.txt
          grep -Fi "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | sed -n '1p' | tee identity.txt
          grep -F "name='com.mediagenda.app.stable'" identity.txt
          grep -F "versionCode='140'" identity.txt
          grep -F "versionName='1.9.130'" identity.txt
          unzip -Z1 SaudePratica.apk | grep -Fx "lib/arm64-v8a/libsaude_llm.so"
          unzip -Z1 SaudePratica.apk | grep -Fx "lib/x86_64/libsaude_llm.so"
          unzip -tqq SaudePratica.apk
      - name: Arquivar exatamente o código-fonte aprovado e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin ef72e227bcb1494c8bac77f2335fe082e6777e50
          test "$(git rev-parse FETCH_HEAD)" = ef72e227bcb1494c8bac77f2335fe082e6777e50
          git archive --format=zip --output=SaudePratica-v1.9.130-CODIGO-FONTE.zip FETCH_HEAD
          test -s SaudePratica-v1.9.130-CODIGO-FONTE.zip
          sha256sum SaudePratica.apk SaudePratica-v1.9.130-CODIGO-FONTE.zip > SaudePratica-v1.9.130-SHA256SUMS.txt
      - name: Publicar Android Release NORMAL v1.9.130 (nunca preview)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=v1.9.130
          cat > notes.md <<'EOF'
          # SaúdePrática Android 1.9.130 — IA local leve, opcional

          **Release Android normal 1.9.xxx**. APK assinada com o mesmo certificado original: pode instalar por cima da versão anterior, sem desinstalar.

          ### Novo Assistente IA
          - Modelo Qwen3 0.6B Q4_K_S (~383 MB), **opcional e gratuito**, para telemóveis Android sem Gemini Nano.
          - Tudo na própria SaúdePrática: abrir Assistente → tocar em «IA local leve · opcional» → confirmar «Descarregar 383 MB». É recomendável usar Wi-Fi e ter 600 MB livres.
          - Após verificar o download, tocar novamente em «IA local leve» para **Instalar e ativar**. Não é preciso procurar ficheiros na Internet.
          - Depois de instalado, responde no próprio telemóvel e não envia as perguntas para servidores externos.
          - É possível remover o modelo. A aplicação e os alarmes continuam a funcionar sem o descarregar.
          - Acesso ao perfil ativo para consultar agenda/medicação; criação de fichas apenas como rascunho e com confirmação humana.
          - Fundo oficial SaúdePrática, botões mais coerentes e correção do espaço para o teclado.

          ### Antes de atualizar
          Faz um backup, instala por cima da app anterior e confirma o funcionamento dos alarmes e das fichas. Os testes Android e emulador passaram; o modelo poderá ser lento em alguns equipamentos e ainda requer validação no telemóvel real. Não utilizar respostas geradas pela IA para alterar doses ou tratamentos.

          Verificações: APK v1.9.130, versionCode 140, package com.mediagenda.app.stable, certificado original e assinaturas v2/v3 confirmadas; motor nativo arm64/x86_64 incluído. O modelo de 383 MB **não é** incluído na APK.

          Código-fonte e soma SHA-256 disponíveis neste Release.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
              --jq '(.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          else
            gh release create "$TAG" SaudePratica.apk \
              SaudePratica-v1.9.130-CODIGO-FONTE.zip \
              SaudePratica-v1.9.130-SHA256SUMS.txt \
              --repo "$REPO" --target ef72e227bcb1494c8bac77f2335fe082e6777e50 \
              --title "SaúdePrática Android v1.9.130 — IA local leve opcional" \
              --notes-file notes.md --latest
          fi
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,assets \
            --jq '.tagName=="v1.9.130" and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          echo "::notice title=Atualização Android publicada::https://github.com/$REPO/releases/tag/$TAG"
