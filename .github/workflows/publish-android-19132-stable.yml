name: Publicar SaúdePrática Android 1.9.132 NORMAL — IA local e online
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-19132-stable.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Confirmar CI, testes e assinatura ORIGINAL aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$REPO" = "DanBar1971/SaudePratica"
          test "$(gh api "repos/$REPO/actions/runs/41730629723" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/41730629723" --jq .head_sha)" = a5efac3115f361a0ee243c507c474504dd0e224d
          test "$(gh api "repos/$REPO/actions/runs/41730629723" --jq .head_branch)" = feat/android-19132-ai-ui-windows-lan
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41731804220 --jq .conclusion)" = success
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41731804220 --jq .head_sha)" = 359a84438856d1218f04bf2e73f8fb45fd913107
          CURRENT="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          test "$CURRENT" = v1.9.131 || test "$CURRENT" = v1.9.132
      - name: Descarregar artefacto assinado — sem ler a chave privada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41731804220 --repo DanBar1971/AndroidAppDev \
            --name SaudePratica-v1.9.132-ORIGINAL-SIGNED --dir signed
          test -s signed/SaudePratica.apk
          test -s signed/SHA256SUMS.txt
          test "$(tr -d '[:space:]' < signed/source-run.txt)" = 41730629723
          (cd signed && sha256sum -c SHA256SUMS.txt)
          cp signed/SaudePratica.apk ./
      - name: Validar identidade, assinatura Android v2/v3 e biblioteca IA incluída
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee signature.txt
          grep -Fi "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | sed -n '1p' | tee identity.txt
          grep -F "name='com.mediagenda.app.stable'" identity.txt
          grep -F "versionCode='142'" identity.txt
          grep -F "versionName='1.9.132'" identity.txt
          unzip -Z1 SaudePratica.apk | grep -Fx "lib/arm64-v8a/libsaude_llm.so"
          unzip -Z1 SaudePratica.apk | grep -Fx "lib/x86_64/libsaude_llm.so"
          unzip -tqq SaudePratica.apk
      - name: Arquivar exatamente o código-fonte aprovado e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin a5efac3115f361a0ee243c507c474504dd0e224d
          test "$(git rev-parse FETCH_HEAD)" = a5efac3115f361a0ee243c507c474504dd0e224d
          git archive --format=zip --output=SaudePratica-v1.9.132-CODIGO-FONTE.zip FETCH_HEAD
          test -s SaudePratica-v1.9.132-CODIGO-FONTE.zip
          sha256sum SaudePratica.apk SaudePratica-v1.9.132-CODIGO-FONTE.zip > SaudePratica-v1.9.132-SHA256SUMS.txt
      - name: Publicar Android Release NORMAL v1.9.132 (nunca preview)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=v1.9.132
          cat > notes.md <<'EOF'
          # SaúdePrática Android 1.9.132 — Assistente renovado + Ligação Windows (teste)
          
          **Release Android normal 1.9.xxx**, assinada com o certificado original, instalada por cima da versão anterior sem desinstalar.
          
          ### Assistente IA
          - A IA local leve Qwen3 mantém o modelo instalado anteriormente, sem novo download de 383 MB.
          - Indicação animada **A gerar resposta…** no topo durante a geração local ou online; envio bloqueado para evitar pedidos duplicados.
          - Botões e atalhos mais próximos do ambiente gráfico SaúdePrática: texto claro, contraste, superfícies escuras translúcidas, contornos e espaçamento.
          - Preserva IA local leve opcional, Gemini Nano nos telemóveis compatíveis, IA Online privada configurável e Ajuda tradicional.
          
          ### Ligação Windows incluída na SaúdePrática principal
          - **Backups e sincronização → Ligação Windows · Wi-Fi (teste)**.
          - No Android tocar **Tornar visível no Wi-Fi**; no Windows 0.8.12 abrir Opções → Sincronização e procurar novamente na mesma rede.
          - Descoberta mDNS ou broadcast UDP e autorização com código de seis dígitos. Ligação por IP mantém-se alternativa.
          - **Apenas descoberta e consentimento: NÃO transfere perfis, medicação, consultas, fotografias ou documentos.** A sincronização clínica real requer canal cifrado e regras de fusão seguras.
          - A descoberta é desligada ao sair do ecrã de ligação. Não abrir portas de router nem usar a ligação de teste para transmitir dados médicos.
          
          ### Instalação e validação
          - Identificador `com.mediagenda.app.stable`, versionCode 142, assinaturas v2/v3 e certificado original verificados; motor de IA arm64-v8a/x86_64 incluído.
          - Fazer backup e atualizar por cima da versão instalada, sem desinstalar; os dados são mantidos.
          - CI compilou e testes automáticos passaram. A descoberta Wi-Fi real e os alarmes devem ser novamente testados em telemóvel físico.
          - O módulo LAN não modifica alarmes, agendamentos, medicação ou ficheiros clínicos.
          
          APK, código-fonte e somas SHA-256 incluídos.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
              --jq '(.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          else
            gh release create "$TAG" SaudePratica.apk \
              SaudePratica-v1.9.132-CODIGO-FONTE.zip \
              SaudePratica-v1.9.132-SHA256SUMS.txt \
              --repo "$REPO" --target 82bfc102409ebff9a3976127f8a5d2b2ffbf3252 \
              --title "SaúdePrática Android v1.9.132 — Assistente renovado + Ligação Windows (teste)" \
              --notes-file notes.md --latest
          fi
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,assets \
            --jq '.tagName=="v1.9.132" and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          echo "::notice title=Atualização Android publicada::https://github.com/$REPO/releases/tag/$TAG"
