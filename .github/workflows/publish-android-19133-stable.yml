name: Publicar SaúdePrática Android 1.9.133 NORMAL — Ajuda tradicional e sincronização
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-19133-stable.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Confirmar CI, testes e assinatura ORIGINAL aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$REPO" = "DanBar1971/SaudePratica"
          test "$(gh api "repos/$REPO/actions/runs/41788736911" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/41788736911" --jq .head_sha)" = c8b74fdc7f45e55178fb5d8db4159f2325e0897b
          test "$(gh api "repos/$REPO/actions/runs/41788736911" --jq .head_branch)" = feat/android-19133-remove-ai-keep-sync
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41789111761 --jq .conclusion)" = success
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41789111761 --jq .head_sha)" = 3d9f7101d6242bdcf79e815c4b4ed5f06821517f
          CURRENT="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          test "$CURRENT" = v1.9.132 || test "$CURRENT" = v1.9.133
      - name: Descarregar artefacto assinado — sem ler a chave privada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41789111761 --repo DanBar1971/AndroidAppDev \
            --name SaudePratica-v1.9.133-ORIGINAL-SIGNED --dir signed
          test -s signed/SaudePratica.apk
          test -s signed/SHA256SUMS.txt
          test "$(tr -d '[:space:]' < signed/source-run.txt)" = 41788736911
          (cd signed && sha256sum -c SHA256SUMS.txt)
          cp signed/SaudePratica.apk ./
      - name: Validar identidade, assinatura original e ausência do motor IA antigo
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee signature.txt
          grep -Fi "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | sed -n '1p' | tee identity.txt
          grep -F "name='com.mediagenda.app.stable'" identity.txt
          grep -F "versionCode='143'" identity.txt
          grep -F "versionName='1.9.133'" identity.txt
          if unzip -Z1 SaudePratica.apk | grep -Fq "libsaude_llm.so"; then
            echo "::error::A APK contém o motor IA que deveria ter sido removido"
            exit 1
          fi
          unzip -tqq SaudePratica.apk
      - name: Arquivar exatamente o código-fonte aprovado e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin c8b74fdc7f45e55178fb5d8db4159f2325e0897b
          test "$(git rev-parse FETCH_HEAD)" = c8b74fdc7f45e55178fb5d8db4159f2325e0897b
          git archive --format=zip --output=SaudePratica-v1.9.133-CODIGO-FONTE.zip FETCH_HEAD
          test -s SaudePratica-v1.9.133-CODIGO-FONTE.zip
          sha256sum SaudePratica.apk SaudePratica-v1.9.133-CODIGO-FONTE.zip > SaudePratica-v1.9.133-SHA256SUMS.txt
      - name: Publicar Android Release NORMAL v1.9.133 (nunca preview)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=v1.9.133
          cat > notes.md <<'EOF'
          # SaúdePrática Android 1.9.133 — Ajuda tradicional, sem IA generativa
          
          **Versão Android normal, assinada com o certificado original.** Atualiza por cima da app anterior, sem desinstalar e sem apagar os dados clínicos.
          
          ### Assistente IA removido
          - Retirado o Assistente generativo de IA Local leve Qwen3, IA Online privada e Gemini Nano do Assistente.
          - O atalho do menu principal volta a abrir a **Ajuda tradicional**, com as respostas habituais da SaúdePrática.
          - A APK deixa de incluir as bibliotecas do motor nativo local e o cliente de IA online do Assistente.
          - **Libertar cerca de 383 MB:** na primeira abertura, a app elimina automaticamente o Qwen descarregado nas versões 1.9.130–1.9.132 e a configuração exclusiva da IA online; cancela também downloads pendentes. Se a remoção falhar, volta a tentar no próximo arranque.
          - A limpeza não toca em perfis, medicação, agendamentos, fotos, documentos, backups nem nos alarmes. A integração Gemini que possa ser utilizada pela Nutrição continua independente e não foi alterada.
          
          ### Prioridade: sincronização entre dispositivos
          - Mantém **Sincronização familiar** Android ↔ Android com Nearby, por perfil.
          - Mantém **Ligação Windows · Wi-Fi (teste)**, na própria SaúdePrática Android, com descoberta mDNS/UDP e autorização de código de seis dígitos compatíveis com Windows 0.8.12.
          - Mantém backups encriptados `.spbackup` com âmbito Família ou Perfil.
          - **Atenção:** a ligação Wi-Fi ao Windows é ainda um teste de deteção e autorização. NÃO transfere ficheiros ou informação clínica; a sincronização bidirecional cifrada continua pendente.
          
          ### Instalação e testes
          - APK `com.mediagenda.app.stable`, versão 1.9.133 / versionCode 143, assinada com certificado original Android v2/v3.
          - Fazer backup, atualizar sem desinstalar e verificar Ajuda, alarmes, perfis, Nearby e ligação Windows no telemóvel real.
          - Compilação e verificações estáticas concluídas no GitHub Actions; validação no dispositivo real ainda necessária.
          
          APK oficial, código-fonte e somas SHA-256 disponíveis no Release.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
              --jq '(.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          else
            gh release create "$TAG" SaudePratica.apk \
              SaudePratica-v1.9.133-CODIGO-FONTE.zip \
              SaudePratica-v1.9.133-SHA256SUMS.txt \
              --repo "$REPO" --target 49304342abf200d0749eb5ce91e9613bb189eb77 \
              --title "SaúdePrática Android v1.9.133 — Ajuda tradicional sem IA generativa" \
              --notes-file notes.md --latest
          fi
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,assets \
            --jq '.tagName=="v1.9.133" and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          echo "::notice title=Atualização Android publicada::https://github.com/$REPO/releases/tag/$TAG"
