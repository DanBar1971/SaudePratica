name: Publicar SaúdePrática Android 1.9.134 NORMAL — Persistência Health Connect
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-19134-stable.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Confirmar CI, testes e assinatura ORIGINAL aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$REPO" = "DanBar1971/SaudePratica"
          test "$(gh api "repos/$REPO/actions/runs/41803866079" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/41803866079" --jq .head_sha)" = 399b32d920fc1008ddde2d36e89df99af55e969c
          test "$(gh api "repos/$REPO/actions/runs/41803866079" --jq .head_branch)" = feat/android-19134-remove-ai-keep-sync
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41804547982 --jq .conclusion)" = success
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41804547982 --jq .head_sha)" = 1b012c323a4ef03142eccf1d6bc769c6f276ba25
          CURRENT="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          test "$CURRENT" = v1.9.133 || test "$CURRENT" = v1.9.134
      - name: Descarregar artefacto assinado — sem ler a chave privada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41804547982 --repo DanBar1971/AndroidAppDev \
            --name SaudePratica-v1.9.134-ORIGINAL-SIGNED --dir signed
          test -s signed/SaudePratica.apk
          test -s signed/SHA256SUMS.txt
          test "$(tr -d '[:space:]' < signed/source-run.txt)" = 41803866079
          (cd signed && sha256sum -c SHA256SUMS.txt)
          cp signed/SaudePratica.apk ./
      - name: Validar identidade, assinatura original e ausência do motor IA antigo
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee signature.txt
          grep -Fi "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | sed -n '1p' | tee identity.txt
          grep -F "name='com.mediagenda.app.stable'" identity.txt
          grep -F "versionCode='144'" identity.txt
          grep -F "versionName='1.9.134'" identity.txt
          if unzip -Z1 SaudePratica.apk | grep -Fq "libsaude_llm.so"; then
            echo "::error::A APK contém o motor IA que deveria ter sido removido"
            exit 1
          fi
          unzip -tqq SaudePratica.apk
      - name: Arquivar exatamente o código-fonte aprovado e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 399b32d920fc1008ddde2d36e89df99af55e969c
          test "$(git rev-parse FETCH_HEAD)" = 399b32d920fc1008ddde2d36e89df99af55e969c
          git archive --format=zip --output=SaudePratica-v1.9.134-CODIGO-FONTE.zip FETCH_HEAD
          test -s SaudePratica-v1.9.134-CODIGO-FONTE.zip
          sha256sum SaudePratica.apk SaudePratica-v1.9.134-CODIGO-FONTE.zip > SaudePratica-v1.9.134-SHA256SUMS.txt
      - name: Publicar Android Release NORMAL v1.9.134 (nunca preview)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=v1.9.134
          cat > notes.md <<'EOF'
          # SaúdePrática Android v1.9.134 — Atividade e Saúde guardada no backup

          **APK normal assinada com o certificado ORIGINAL** da SaúdePrática. Atualiza por cima da 1.9.133, mantendo todos os perfis, alarmes, documentos, medicação e dados já guardados.

          ### Novidade: Health Connect deixa de ser apenas consulta em memória
          - Sempre que o utilizador abrir/atualizar «Atividade e Saúde», as medições efetivamente devolvidas pelo Health Connect são guardadas localmente num ficheiro JSON privado por perfil autorizado, sem upload para a Internet.
          - Inclui o histórico consultado dos últimos sete dias: passos, distância, energia ativa, sono, frequência cardíaca e peso partilhado pelo Health Connect; inclui energia total de hoje, quando disponível.
          - Guarda também as medições mais recentes disponíveis de SpO₂, ritmo em repouso, tensão arterial, frequência respiratória, temperatura e peso Health Connect, com data/hora reais quando fornecidas.
          - Mantém separadas as medições manuais de peso já existentes; não sobrescreve dados manuais e não transforma valores ausentes em zero.
          - Os novos ficheiros entram automaticamente no backup ZIP Android e no .spbackup familiar, através do ZIP Android preservado. Apenas novos backups, criados APÓS abrir e atualizar a versão 1.9.134, contêm estes valores.
          - Sem novas permissões, sem serviços de fundo e sem transmissão automática de dados para Windows. O Windows 0.8.14 ainda precisa de uma atualização própria para interpretar os novos ficheiros Health Connect.

          ### Testes e segurança
          - Atualização local, separada por perfil, com gravação atómica e data de captura.
          - Permissões Health Connect respeitadas, identificação dos perfis validada e registos do Android mantidos.
          - Ajuda tradicional mantida; IA generativa do Assistente continua removida. Nutrição, sincronização Nearby, alarmes e ligação Windows Wi-Fi não sofreram alterações.
          - Compilação e verificações de integridade concluídas no GitHub Actions. Validação em dispositivo real continua necessária.
          - Se o Health Connect não tiver dados ou permissões para uma categoria, essa categoria permanece sem valor (nunca zero inventado).

          **Importante:** os backups completos contêm dados de saúde sensíveis. Guarda-os em local protegido e não partilhes os ficheiros sem necessidade.

          APK oficial, código-fonte e somas SHA-256 disponíveis nesta release.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
              --jq '(.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          else
            gh release create "$TAG" SaudePratica.apk \
              SaudePratica-v1.9.134-CODIGO-FONTE.zip \
              SaudePratica-v1.9.134-SHA256SUMS.txt \
              --repo "$REPO" --target 49304342abf200d0749eb5ce91e9613bb189eb77 \
              --title "SaúdePrática Android v1.9.134 — Dados Health Connect guardados nos backups" \
              --notes-file notes.md --latest
          fi
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,assets \
            --jq '.tagName=="v1.9.134" and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          echo "::notice title=Atualização Android publicada::https://github.com/$REPO/releases/tag/$TAG"
