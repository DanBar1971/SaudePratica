name: Publicar SaúdePrática Android 1.9.136 NORMAL — Processos hospitalares
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-19136-stable.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Confirmar CI, testes e assinatura ORIGINAL aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$REPO" = "DanBar1971/SaudePratica"
          test "$(gh api "repos/$REPO/actions/runs/41822099755" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/41822099755" --jq .head_sha)" = 360dcd58724fcac95f72fb521825a0e4c76b2e94
          test "$(gh api "repos/$REPO/actions/runs/41822099755" --jq .head_branch)" = feat/android-19136-hospital-processes
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41822720964 --jq .conclusion)" = success
          test "$(gh api repos/DanBar1971/AndroidAppDev/actions/runs/41822720964 --jq .head_sha)" = 034bdd79d277c0de2bfc34c1ab123c640ae542d8
          CURRENT="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          test "$CURRENT" = v1.9.135 || test "$CURRENT" = v1.9.136
      - name: Descarregar artefacto assinado — sem ler a chave privada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41822720964 --repo DanBar1971/AndroidAppDev \
            --name SaudePratica-v1.9.136-ORIGINAL-SIGNED --dir signed
          test -s signed/SaudePratica.apk
          test -s signed/SHA256SUMS.txt
          test "$(tr -d '[:space:]' < signed/source-run.txt)" = 41822099755
          (cd signed && sha256sum -c SHA256SUMS.txt)
          cp signed/SaudePratica.apk ./
      - name: Validar identidade, assinatura original e ausência do motor IA antigo
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee signature.txt
          grep -Fi "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | sed -n '1p' | tee identity.txt
          grep -F "name='com.mediagenda.app.stable'" identity.txt
          grep -F "versionCode='146'" identity.txt
          grep -F "versionName='1.9.136'" identity.txt
          if unzip -Z1 SaudePratica.apk | grep -Fq "libsaude_llm.so"; then
            echo "::error::A APK contém o motor IA que deveria ter sido removido"
            exit 1
          fi
          unzip -tqq SaudePratica.apk
      - name: Arquivar exatamente o código-fonte aprovado e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 360dcd58724fcac95f72fb521825a0e4c76b2e94
          test "$(git rev-parse FETCH_HEAD)" = 360dcd58724fcac95f72fb521825a0e4c76b2e94
          git archive --format=zip --output=SaudePratica-v1.9.136-CODIGO-FONTE.zip FETCH_HEAD
          test -s SaudePratica-v1.9.136-CODIGO-FONTE.zip
          sha256sum SaudePratica.apk SaudePratica-v1.9.136-CODIGO-FONTE.zip > SaudePratica-v1.9.136-SHA256SUMS.txt
      - name: Publicar Android Release NORMAL v1.9.136 (nunca preview)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=v1.9.136
          cat > notes.md <<'EOF'
          # SaúdePrática Android 1.9.136 — Processos hospitalares e calendário

          APK oficial assinada com o certificado ORIGINAL da SaúdePrática, instalável por cima da versão 1.9.135 sem desinstalar nem apagar os dados.

          ## Novidades

          - **Situação Clínica → Processo hospitalar**: abrir cada hospital ou clínica associado ao número de processo já guardado.
          - **A minha equipa**: adicionar, editar, eliminar e consultar contactos, telefonar e enviar email. Importação **manual** de um ficheiro JSON (com verificação de duplicados) para o processo selecionado.
          - **Taxas moderadoras**: Consultas, Exames e Análises; valores por linha, histórico e estado Pago / Por pagar / Isento / Anulado, com total de dívida calculado dos registos introduzidos.
          - **Identificação hospitalar**: guardar uma imagem ou captura do cartão/código hospitalar no processo, em armazenamento privado da aplicação.
          - **Declarações de transporte**: registar o pedido e acompanhar manualmente os estados, referências, datas e notas, incluindo pedidos já efetuados.
          - **Agenda → Adicionar consulta ao calendário do telemóvel**: escolher marcação futura e abrir o editor nativo para confirmar e guardar; sem permissões invasivas e sem criar eventos automaticamente.

          ## Segurança, dados e limites

          - **Sem qualquer acesso ou importação automática da app IPO Lisboa, nem pedido enviado ao hospital.** Os valores e contactos são introduzidos manualmente, não refletem necessariamente os sistemas oficiais.
          - Registos clínicos isolados por perfil, unidade hospitalar e número de processo; o arquivo reside numa pasta privada já suportada pelo backup familiar e transferência Nearby por perfil.
          - Não estão incluídos dados identificativos reais de pacientes ou de equipas nos ficheiros públicos da release.
          - O calendário não tem sincronização bidirecional automática: alterações posteriores na Agenda não atualizam o evento criado.
          - Mantém backups com PIN de 4 dígitos, compatibilidade dos backups antigos, a Ajuda tradicional, os alarmes TOMEI/ADIAR e a aplicação sem IA generativa.
          - O Android 1.9.136 foi compilado e validado por CI e a assinatura original foi confirmada. Recomenda-se validar no dispositivo real antes de depender destas funções para decisões clínicas.

          Código-fonte exato do build e SHA-256 da APK acompanham esta release.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
              --jq '(.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          else
            gh release create "$TAG" SaudePratica.apk \
              SaudePratica-v1.9.136-CODIGO-FONTE.zip \
              SaudePratica-v1.9.136-SHA256SUMS.txt \
              --repo "$REPO" --target 360dcd58724fcac95f72fb521825a0e4c76b2e94 \
              --title "SaúdePrática Android v1.9.136 — Processos hospitalares e calendário" \
              --notes-file notes.md --latest
          fi
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,assets \
            --jq '.tagName=="v1.9.136" and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")' | grep -Fx true
          echo "::notice title=Atualização Android publicada::https://github.com/$REPO/releases/tag/$TAG"
