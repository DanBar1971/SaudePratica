name: SaúdePrática Android — APK auxiliar LAN sem dados 0.1
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-lan-link-01.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter projeto de teste isolado (preserva a app Android oficial)
        uses: actions/checkout@v4
        with:
          ref: release/lan-pairing-preview-084-20261103
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK auxiliar DEBUG assinada autonomamente
        run: gradle -p android/lan-link-test --no-daemon --stacktrace assembleDebug
      - name: Confirmar instalação separada e assinatura de teste
        shell: bash
        run: |
          set -euo pipefail
          APK=android/lan-link-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 1 | tee android-package.txt
          grep -F "name='pt.saudepratica.linktest'" android-package.txt
          grep -F "versionName='0.1'" android-package.txt
          if grep -F "name='com.mediagenda.app.stable'" android-package.txt; then
            echo 'Recusado: nunca substituir a app Android oficial.' >&2
            exit 1
          fi
          cp "$APK" SaudePratica-Ligacao-Teste.apk
          sha256sum SaudePratica-Ligacao-Teste.apk > SHA256SUMS.txt
      - name: Publicar APK de ligação testável sem modificar release estável Android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=android-lan-link-v0.1-preview
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Já existe release de teste: não sobrescrever.' >&2
            exit 1
          fi
          gh release create "$TAG" SaudePratica-Ligacao-Teste.apk SHA256SUMS.txt \
            --repo "$REPO" --target "$(git rev-parse HEAD)" \
            --title "SaúdePrática Android · Ligação LAN 0.1 (aplicação auxiliar de teste)" \
            --notes-file android/lan-link-test/README.md --prerelease --latest=false
