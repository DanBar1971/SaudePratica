name: Publicar SaúdePrática v1.9.121 assinada e atualizar website
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-signed-v19121.yml"
      - "MediAgenda/release-verified/v1.9.121/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install zstd and Android build tools for public verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Retrieve exact vetted v1.9.121 build from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41090882766 --repo DanBar1971/SaudePratica --name SaudePratica-v1.9.121-UNSIGNED --dir original-unsigned
          test "$(find original-unsigned -name '*.apk' -type f | wc -l)" -eq 1
          cp "$(find original-unsigned -name '*.apk' -type f | head -n 1)" unsigned-original.apk
          echo "446bcd6055f01af7be9e421ac7c042ea1471153aba2c0f04d229b204ee208d13  unsigned-original.apk" | sha256sum --check
      - name: Reconstruct signed APK only from verified public material
        run: |
          python3 MediAgenda/release-verified/v1.9.121/rebuild.py
          echo "e4f650d1c95b07133bea0750e5e603fd93b64dc876dd13166ceed43b79d858ab  SaudePratica.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee apk-verified.txt
          grep -F "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" apk-verified.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verified.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" apk-verified.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | head -n 1 | tee apk-identity.txt
          grep -F "name='com.mediagenda.app.stable'" apk-identity.txt
          grep -F "versionCode='131'" apk-identity.txt
          grep -F "versionName='1.9.121'" apk-identity.txt
      - name: Create immutable release and trigger Pages redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.9.121
          REPO=DanBar1971/SaudePratica
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
              jq -e '.tagName=="v1.9.121" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
            exit 0
          fi
          git archive --format=zip --output="SaudePratica-v1.9.121-CODIGO-FONTE.zip" HEAD
          sha256sum SaudePratica.apk SaudePratica-v1.9.121-CODIGO-FONTE.zip > SaudePratica-v1.9.121-SHA256SUMS.txt
          gh release create "$TAG" SaudePratica.apk SaudePratica-v1.9.121-CODIGO-FONTE.zip SaudePratica-v1.9.121-SHA256SUMS.txt --repo "$REPO" --target "$GITHUB_SHA" --title "SaúdePrática v1.9.121 — Correções de interface e Atalhos" --notes-file MediAgenda/v141_overrides/RELEASE_NOTES.md --latest
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
            jq -e '.tagName=="v1.9.121" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
          gh workflow run pages.yml --repo "$REPO" --ref main
