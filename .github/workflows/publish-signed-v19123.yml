name: Publicar SaúdePrática v1.9.123 com assinatura original verificada
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-signed-v19123.yml"
      - "MediAgenda/release-verified/v1.9.123/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install zstd and Android signing verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Retrieve exact previously verified unsigned Android v1.9.123
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41191794498 --repo DanBar1971/SaudePratica --name SaudePratica-v1.9.123-UNSIGNED --dir original-unsigned
          test "$(find original-unsigned -name '*.apk' -type f | wc -l)" -eq 1
          cp "$(find original-unsigned -name '*.apk' -type f | head -n 1)" original-unsigned.apk
          echo "bee9d80657e486df187bac62306d3c9a722759b2e86b1df952119307e06fea71  original-unsigned.apk" | sha256sum --check
      - name: Reconstruct and verify the original-certificate signed APK
        run: |
          base64 --decode MediAgenda/release-verified/v1.9.123/signed.patch.zst.b64 > signed.patch.zst
          echo "af6552e196c3df2ea031b698918f20688086f67f2ae6eaca98f534dbc2c91f64  signed.patch.zst" | sha256sum --check
          zstd --long=28 --decompress --patch-from=original-unsigned.apk signed.patch.zst -o SaudePratica.apk
          echo "6fd559af1513b3f8023e59a470b176e7b8423a33f100959a525408c95c0184b9  SaudePratica.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee apk-verified.txt
          grep -F "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" apk-verified.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verified.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" apk-verified.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | head -n 1 | tee apk-identity.txt
          grep -F "name='com.mediagenda.app.stable'" apk-identity.txt
          grep -F "versionCode='133'" apk-identity.txt
          grep -F "versionName='1.9.123'" apk-identity.txt
      - name: Publish immutable signed APK with source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.9.123
          REPO=DanBar1971/SaudePratica
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
              jq -e '.tagName=="v1.9.123" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
            exit 0
          fi
          git archive --format=zip --output="SaudePratica-v1.9.123-CODIGO-FONTE.zip" HEAD
          sha256sum SaudePratica.apk SaudePratica-v1.9.123-CODIGO-FONTE.zip > SaudePratica-v1.9.123-SHA256SUMS.txt
          gh release create "$TAG" SaudePratica.apk SaudePratica-v1.9.123-CODIGO-FONTE.zip SaudePratica-v1.9.123-SHA256SUMS.txt --repo "$REPO" --target "$GITHUB_SHA" --title "SaúdePrática v1.9.123 — Correção do backup encriptado Android ↔ Windows (Fase 1)" --notes-file MediAgenda/v143_overrides/RELEASE_NOTES.md --latest
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
            jq -e '.tagName=="v1.9.123" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
          gh workflow run pages.yml --repo "$REPO" --ref main

# Signed delta contains no private key; signature is re-verified before publishing.
