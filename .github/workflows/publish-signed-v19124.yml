name: Publicar SaúdePrática v1.9.124 com assinatura original verificada
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-signed-v19124.yml"
      - "MediAgenda/release-verified/v1.9.124/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install public zstd and Android signing verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Retrieve exact approved unsigned Android v1.9.124
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41285611919 --repo DanBar1971/SaudePratica --name SaudePratica-v1.9.124-UNSIGNED --dir original-unsigned
          test "$(find original-unsigned -name '*.apk' -type f | wc -l)" -eq 1
          cp "$(find original-unsigned -name '*.apk' -type f | head -n 1)" original-unsigned.apk
          echo "e5833e6c9d74bead79bb0e437b0cfc0437622f5da3599625ef49699bfd41c760  original-unsigned.apk" | sha256sum --check
      - name: Reconstruct and verify original-certificate signed v1.9.124 APK
        run: |
          base64 --decode MediAgenda/release-verified/v1.9.124/signed.patch.zst.b64 > signed.patch.zst
          echo "09e38abb0d994042c199ad5910082e44404bddb545aa175186c657dc167baa8a  signed.patch.zst" | sha256sum --check
          zstd --long=28 --decompress --patch-from=original-unsigned.apk signed.patch.zst -o SaudePratica.apk
          echo "b91f42fe946ab82a501ac005477c2f1ef44127dcc20a0330dd0921e0401feea7  SaudePratica.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee apk-verified.txt
          grep -F "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" apk-verified.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verified.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" apk-verified.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | head -n 1 | tee apk-identity.txt
          grep -F "name='com.mediagenda.app.stable'" apk-identity.txt
          grep -F "versionCode='134'" apk-identity.txt
          grep -F "versionName='1.9.124'" apk-identity.txt
      - name: Publish immutable signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.9.124
          REPO=DanBar1971/SaudePratica
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
              jq -e '.tagName=="v1.9.124" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
            exit 0
          fi
          git archive --format=zip --output="SaudePratica-v1.9.124-CODIGO-FONTE.zip" HEAD
          sha256sum SaudePratica.apk SaudePratica-v1.9.124-CODIGO-FONTE.zip > SaudePratica-v1.9.124-SHA256SUMS.txt
          gh release create "$TAG" SaudePratica.apk SaudePratica-v1.9.124-CODIGO-FONTE.zip SaudePratica-v1.9.124-SHA256SUMS.txt --repo "$REPO" --target "$GITHUB_SHA" --title "SaúdePrática v1.9.124 — Permissões de alarmes Redmi, sem alterar o alarme" --notes-file MediAgenda/v144_overrides/RELEASE_NOTES.md --latest
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
            jq -e '.tagName=="v1.9.124" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
          gh workflow run pages.yml --repo "$REPO" --ref main
# Signed delta and APK have no private signing key. The original certificate,
# exact build hash, full signed binary hash and Android package are all verified.
