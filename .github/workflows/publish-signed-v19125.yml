name: Publicar SaúdePrática v1.9.125 com assinatura original verificada
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-signed-v19125.yml"
      - "MediAgenda/release-verified/v1.9.125/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install public zstd and Android signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Download exact CI-validated unsigned Android v1.9.125
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41303104138 --repo DanBar1971/SaudePratica --name SaudePratica-v1.9.125-UNSIGNED --dir original-unsigned
          test "$(find original-unsigned -name '*.apk' -type f | wc -l)" -eq 1
          cp "$(find original-unsigned -name '*.apk' -type f | head -n 1)" original-unsigned.apk
          echo "3af42a77db1582f89f48ece437d26dcb5e8632e3abc6f885b1cb354b33c302f8  original-unsigned.apk" | sha256sum --check
      - name: Reconstruct originally signed APK without any private key
        run: |
          python3 MediAgenda/release-verified/v1.9.125/rebuild.py
          echo "2574f1c085217d389d713a96802e434b4fecd090d88d4c8020c214138e9220d9  SaudePratica.apk" | sha256sum --check
      - name: Verify original certificate, Android signature and version identity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk | tee apk-verified.txt
          grep -F "7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a" apk-verified.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verified.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" apk-verified.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging SaudePratica.apk | head -n 1 | tee apk-identity.txt
          grep -F "name='com.mediagenda.app.stable'" apk-identity.txt
          grep -F "versionCode='135'" apk-identity.txt
          grep -F "versionName='1.9.125'" apk-identity.txt
      - name: Publish permanent signed APK, source archive, checksums and redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.9.125
          REPO=DanBar1971/SaudePratica
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
              jq -e '.tagName=="v1.9.125" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
            exit 0
          fi
          git archive --format=zip --output="SaudePratica-v1.9.125-CODIGO-FONTE.zip" HEAD
          sha256sum SaudePratica.apk SaudePratica-v1.9.125-CODIGO-FONTE.zip > SaudePratica-v1.9.125-SHA256SUMS.txt
          gh release create "$TAG" SaudePratica.apk SaudePratica-v1.9.125-CODIGO-FONTE.zip SaudePratica-v1.9.125-SHA256SUMS.txt --repo "$REPO" --target "$GITHUB_SHA" --title "SaúdePrática v1.9.125 — Nearby mais fiável, progresso e confirmação de sincronização" --notes-file MediAgenda/v145_overrides/RELEASE_NOTES.md --latest
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets |
            jq -e '.tagName=="v1.9.125" and (.isDraft|not) and (.isPrerelease|not) and any(.assets[]; .name=="SaudePratica.apk")'
          gh workflow run pages.yml --repo "$REPO" --ref main
# The public metadata delta contains no signing key. SHA-256, Android v2/v3,
# package name and version must all match the locally approved signed binary.
