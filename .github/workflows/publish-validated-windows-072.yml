name: Publicar Windows 0.7.2 pré-visualização validada
on:
  push:
    branches: [fix/portable-backup-unificado-20261102]
    paths:
      - ".github/interop-publish-windows-072.request"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validar builds antes de publicar qualquer instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          VALIDATED_SHA="7040ef9c1d4f8da02e219622ddc5e4271f90860d"
          ANDROID_RUN="41422277357"
          WINDOWS_RUN="41422277067"
          for RUN in "$ANDROID_RUN" "$WINDOWS_RUN"; do
            STATUS=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.conclusion')
            SHA=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_sha')
            EVENT=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.event')
            test "$STATUS" = "success" || { echo "::error::CI run $RUN is not successful: $STATUS"; exit 1; }
            test "$SHA" = "$VALIDATED_SHA" || { echo "::error::Source mismatch in run $RUN"; exit 1; }
            test "$EVENT" = "pull_request" || { echo "::error::Unreviewed CI event: $EVENT"; exit 1; }
          done
          echo "Verified Android and Windows CI at exact commit $VALIDATED_SHA."
      - name: Obter EXE que passou testes do Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41422277067 --repo "$GITHUB_REPOSITORY" \
            --name SaudePratica-Windows-INSTALADOR-EXPERIMENTAL --dir installer
          FILE=installer/SaudePratica-Setup.exe
          test -s "$FILE"
          test "$(wc -c < "$FILE")" -gt 5000000
          test "$(head -c 2 "$FILE")" = 'MZ'
          sha256sum "$FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publicar release Windows experimental sem alterar Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="windows-v0.7.2-preview"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" installer/SaudePratica-Setup.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 7040ef9c1d4f8da02e219622ddc5e4271f90860d \
            --title "SaúdePrática Windows 0.7.2 — pré-visualização de backups Família e Perfil" \
            --notes-file windows/RELEASE_NOTES_PREVIEW.md --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | map(.name) | index("SaudePratica-Setup.exe") != null' | grep -Fx true
