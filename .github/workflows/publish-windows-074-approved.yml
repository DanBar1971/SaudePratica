name: Publicar Windows 0.7.4 após testes de perfis, fotografias do CC e desempenho
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-windows-074-approved.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirmar código e execução de testes Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN=41449991160
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_sha')" = 84d4d3a6cecc6498f1d9d1bd51b3da51199e4c4b
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.event')" = pull_request
          echo 'A compilação, testes sintéticos, arranque real da app e compilação Inno Setup 0.7.4 passaram.'
      - name: Descarregar o instalador testado e confirmar SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41449991160 --repo "$GITHUB_REPOSITORY" \
            --name SaudePratica-Windows-INSTALADOR-EXPERIMENTAL --dir installer
          test -s installer/SaudePratica-Setup.exe
          echo "563bd24f893a97268211b1b8e6e5883b08c5885ce15849a0e157786ef031a246  installer/SaudePratica-Setup.exe" | sha256sum -c -
          cp installer/SaudePratica-Setup.exe SaudePratica-Setup.exe
          sha256sum SaudePratica-Setup.exe > SHA256SUMS.txt
      - name: Publicar Windows 0.7.4 no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=windows-v0.7.4-preview
          TARGET=release/windows-074-profiles-fast-20261102
          gh api "repos/$REPO/contents/windows/RELEASE_NOTES_074.md?ref=$TARGET" --jq .content | base64 --decode > release-notes.md
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" SaudePratica-Setup.exe SHA256SUMS.txt \
              --repo "$REPO" --target "$TARGET" \
              --title "SaúdePrática Windows v0.7.4 — ficha Android organizada, CC e perfis rápidos" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
          gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
            --jq '(.isDraft|not) and .isPrerelease and any(.assets[]; .name=="SaudePratica-Setup.exe")' | grep -Fx true
