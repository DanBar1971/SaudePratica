name: Publicar Windows 0.7.5 após auditoria das fronteiras entre módulos
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-windows-075-approved.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirmar código e execução de testes Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN=41458179893
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_sha')" = d2c49f86efdefa14e857cfb06c66bfece4586142
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.event')" = pull_request
          echo 'A compilação, testes sintéticos, arranque real da app e compilação Inno Setup 0.7.5 passaram.'
      - name: Descarregar o instalador testado e confirmar SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41458179893 --repo "$GITHUB_REPOSITORY" \
            --name SaudePratica-Windows-INSTALADOR-EXPERIMENTAL --dir installer
          test -s installer/SaudePratica-Setup.exe
          echo "2aa4ee3e6ea5e6da414a494af23e09aff2d75287b3f916df7e39df630f29f2af  installer/SaudePratica-Setup.exe" | sha256sum -c -
          cp installer/SaudePratica-Setup.exe SaudePratica-Setup.exe
          sha256sum SaudePratica-Setup.exe > SHA256SUMS.txt
      - name: Publicar Windows 0.7.5 no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG=windows-v0.7.5-preview
          TARGET=release/windows-075-profile-safe-20261102
          gh api "repos/$REPO/contents/windows/RELEASE_NOTES_075.md?ref=$TARGET" --jq .content | base64 --decode > release-notes.md
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" SaudePratica-Setup.exe SHA256SUMS.txt \
              --repo "$REPO" --target "$TARGET" \
              --title "SaúdePrática Windows v0.7.5 — cuidador correto e dados pessoais isolados" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
          gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
            --jq '(.isDraft|not) and .isPrerelease and any(.assets[]; .name=="SaudePratica-Setup.exe")' | grep -Fx true
