name: Publicar SaúdePrática Windows 0.8.19 — Restauro com PIN
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-windows-0819-approved.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verificar código e testes Windows 0.8.19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=DanBar1971/SaudePratica
          RUN=41843092680
          SOURCE=6fed9e6dccef6caeb16fb4b5f6af3a72c2bf38b5
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .head_sha)" = "$SOURCE"
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .head_branch)" = release/windows-0819-pin-restore-hotfix-20261104
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = v1.9.137
      - name: Descarregar EXE exatamente da CI aprovada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41843092680 --repo DanBar1971/SaudePratica \
            --name SaudePratica-Windows-0819-TEST --dir installer
          test -s installer/SaudePratica-Setup.exe
          file installer/SaudePratica-Setup.exe | grep -Ei "PE32|MS Windows"
          test "$(stat -c%s installer/SaudePratica-Setup.exe)" -gt 5000000
          cp installer/SaudePratica-Setup.exe ./SaudePratica-Setup.exe
          sha256sum SaudePratica-Setup.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publicar EXE corrigido Windows 0.8.19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=DanBar1971/SaudePratica
          TAG=windows-v0.8.19-preview
          cat > notes.md <<'EOF'
          # SaúdePrática Windows 0.8.19 — Corrigido o restauro com PIN numérico

          **Hotfix do Windows para backups familiares e por perfil.** O Android 1.9.137 não precisa de atualização para esta correção.

          ## Correção
          - Corrigida a validação antiga que, depois de autenticar um backup .spbackup por PIN de 4 dígitos, bloqueava a substituição de perfis com o aviso «Indica uma palavra-passe segura para a cópia de segurança».
          - A cópia de segurança automática antes do restauro utiliza agora um **PIN numérico de 4 dígitos** como os backups atuais. Continua a ser criada e encriptada antes de modificar os perfis existentes.
          - Mantida a compatibilidade de leitura de backups antigos protegidos por palavra-passe de 10 ou mais caracteres.
          - Testes de regressão: restauro completo de perfil existente com PIN, preservação e leitura da cópia anterior encriptada, e rejeição de credenciais curtas inválidas sem alterar os dados.
          - Mantidas as funcionalidades 0.8.18: Situação Clínica com consulta de processos hospitalares Android, contactos da equipa, taxas, transportes, identificação por imagem, perfis e medicação.

          ## Instalação e segurança
          - Podes instalar por cima do Windows 0.8.18 sem desinstalar nem apagar os dados. Fecha a aplicação e o agente Avisos antes de executar o instalador.
          - Para restaurar o backup familiar, introduz o **PIN do próprio ficheiro**, que pode ser diferente do PIN de entrada do Windows.
          - Continua sem ligação à aplicação IPO Lisboa nem sincronização clínica automática por Wi-Fi.
          - Não inclui qualquer backup ou dado clínico real. O instalador é experimental e não tem assinatura digital Windows; o SmartScreen pode apresentar um aviso.
          - Validado por testes automatizados, ensaios da aplicação e do executável, e construção do instalador na CI Windows.

          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json isPrerelease,assets --jq '.isPrerelease and any(.assets[]; .name=="SaudePratica-Setup.exe")' | grep -Fx true
          else
            gh release create "$TAG" SaudePratica-Setup.exe SHA256SUMS.txt \
              --repo "$REPO" --target 6fed9e6dccef6caeb16fb4b5f6af3a72c2bf38b5 \
              --title "SaúdePrática Windows 0.8.19 — Restauro PIN de 4 dígitos" \
              --notes-file notes.md --prerelease --latest=false
          fi
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = v1.9.137
          gh release view "$TAG" --repo "$REPO" --json isPrerelease,assets \
            --jq '.isPrerelease and any(.assets[]; .name=="SaudePratica-Setup.exe")' | grep -Fx true
          echo "::notice title=Windows 0.8.19 publicado::https://github.com/$REPO/releases/tag/$TAG"