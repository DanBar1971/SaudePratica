name: SaúdePrática Desktop — Windows experimental build
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "shared/**"
      - "assets/**"
      - "MediAgenda/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "shared/**"
      - "assets/**"
      - "MediAgenda/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDOWS_APP_VERSION: "0.7.0"

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows build dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Compile Python and run secure backup tests
        run: |
          python -m compileall -q windows shared
          python -m unittest discover -s shared/tests -v
          python -m unittest discover -s windows/tests -v
      - name: Ensaiar o arranque real do interface Python
        run: python windows/tools/smoke_windows.py --script
      - name: Criar identidade Windows oficial (ICO e splash)
        shell: pwsh
        run: |
          python windows/tools/build_brand_assets.py
          if (!(Test-Path "dist/saude_icon.ico")) { throw "Ícone oficial em falta" }
          if (!(Test-Path "dist/saude_splash_windows.png")) { throw "Splash oficial em falta" }
      - name: Compilar aplicação com arranque rápido e splash
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name SaudePraticaDesktop --icon dist/saude_icon.ico --splash dist/saude_splash_windows.png --paths . --collect-all customtkinter --add-data "assets;assets" --add-data "dist/saude_icon.ico;assets" windows/desktop_v04.py
          if ($LASTEXITCODE -ne 0) { throw "Falhou a compilação PyInstaller" }
          if (!(Test-Path "dist/SaudePraticaDesktop/SaudePraticaDesktop.exe")) { throw "EXE em falta" }
          if (!(Test-Path "dist/SaudePraticaDesktop/_internal")) { throw "Bibliotecas da instalação rápida ausentes" }
          Get-FileHash "dist/SaudePraticaDesktop/SaudePraticaDesktop.exe" -Algorithm SHA256
      - name: Testar executável Windows empacotado antes de publicar
        run: python windows/tools/smoke_windows.py --exe
      - name: Instalar Inno Setup 6 no runner Windows
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 indisponível" }
      - name: Compilar instalador EXE com instalação e desinstalação
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:WINDOWS_APP_VERSION" "windows\installer\SaudePratica.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falhou a compilação do instalador" }
          $setup = "dist/installer/SaudePratica-Setup.exe"
          if (!(Test-Path $setup)) { throw "Instalador em falta" }
          if ((Get-Item $setup).Length -lt 5000000) { throw "Instalador incompleto" }
          Get-FileHash $setup -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-Windows-INSTALADOR-EXPERIMENTAL
          path: dist/installer/SaudePratica-Setup.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publicar instalador em release permanente (sem afetar última APK Android)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v$env:WINDOWS_APP_VERSION-preview"
          $repo = "$env:GITHUB_REPOSITORY"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "A release $tag já existe. Não substituo instaladores publicados sem aumentar a versão."
          } else {
            gh release create $tag "dist/installer/SaudePratica-Setup.exe" --repo $repo --target main --title "SaúdePrática Desktop $env:WINDOWS_APP_VERSION - Windows experimental" --notes-file windows/RELEASE_NOTES_PREVIEW.md --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Falhou a publicação do instalador no GitHub Releases" }
          }
          $hasAsset = gh release view $tag --repo $repo --json assets --jq '[.assets[].name] | any(. == "SaudePratica-Setup.exe")'
          if ($LASTEXITCODE -ne 0 -or "$hasAsset".Trim() -ne "true") { throw "A release não contém o instalador" }
