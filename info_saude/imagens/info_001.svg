<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
<title id="title">Gosta desta App? Apoie o autor com um cafezinho!</title>
<desc id="desc">Convite voluntário para apoiar o desenvolvimento da SaúdePrática. Ilustração de uma chávena de café sorridente, com coração, sobre uma mesa acolhedora.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e9"/><stop offset=".52" stop-color="#f9efe2"/><stop offset="1" stop-color="#eedccb"/></linearGradient>
<linearGradient id="cup" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f6d7b1"/></linearGradient>
<linearGradient id="blue" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#117d9e"/><stop offset="1" stop-color="#034965"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#876245" flood-opacity=".21"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
