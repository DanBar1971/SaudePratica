<text x="66" y="444" font-family="DejaVu Sans,Arial,sans-serif" font-size="49" fill="#243343" font-weight="700">com um cafezinho!</text>
<text x="68" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#52616a">Se a SaúdePrática o ajuda no dia a dia,</text>
<text x="68" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#52616a">um pequeno gesto faz a diferença.</text>
